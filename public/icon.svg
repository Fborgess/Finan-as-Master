<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <g filter="url(#shadow)">
    <!-- Wallet / Card Icon Shape -->
    <rect x="112" y="144" width="288" height="224" rx="28" fill="url(#accent)" opacity="0.9" />
    <rect x="128" y="176" width="256" height="192" rx="24" fill="#1e293b" />
    
    <!-- Financial Growth Trend Lines -->
    <path d="M 160 300 L 220 250 L 280 270 L 352 196" fill="none" stroke="url(#green)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="352" cy="196" r="10" fill="#34d399" />
    
    <!-- Dollar sign / symbol -->
    <circle cx="256" cy="120" r="36" fill="url(#accent)" />
    <text x="256" y="132" font-family="Arial, sans-serif" font-weight="bold" font-size="38" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
